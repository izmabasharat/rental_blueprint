<div class="field {% if f.errors %}field-error{% endif %}">
  <label for="{{ f.id_for_label }}" class="text-sm font-medium text-slate-700">{{ f.label }}{% if f.field.required %} <span class="text-red-600" aria-hidden="true">*</span>{% endif %}</label>
  <div class="mt-1">{{ f }}</div>
  {% if f.help_text %}<p class="mt-1 text-xs text-slate-500">{{ f.help_text|safe }}</p>{% endif %}
  {% for e in f.errors %}<p class="mt-1 text-sm text-red-700"><i class="fa-solid fa-circle-exclamation mr-1"></i>{{ e }}</p>{% endfor %}
</div>
