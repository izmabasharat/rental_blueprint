{% extends "base.html" %}
{% block title %}Property unavailable{% endblock %}
{% block content %}
<main class="mx-auto max-w-lg px-4 py-20 text-center">
  <h1 class="text-2xl font-bold text-slate-900">This property is no longer available</h1>
  <p class="mt-2 text-slate-600">It may have been rented, sold or removed by the agent.</p>
  <a href="{% url 'rentals:list' %}" class="mt-6 inline-block rounded-lg bg-teal-800 px-6 py-3 font-semibold text-white hover:bg-teal-900">Find similar properties</a>
</main>
{% endblock %}
