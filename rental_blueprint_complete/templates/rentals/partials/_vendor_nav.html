{% with base="whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium" %}
<nav class="mb-6 flex gap-1 overflow-x-auto border-b border-slate-200 pb-2" aria-label="Vendor">
  <a href="{% url 'rentals:dashboard' %}" class="{{ base }} {% if active_tab == 'overview' %}bg-teal-800 text-white{% else %}text-slate-700 hover:bg-slate-100{% endif %}">Overview</a>
