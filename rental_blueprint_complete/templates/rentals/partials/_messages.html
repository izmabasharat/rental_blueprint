{% if messages %}
<div class="mx-auto max-w-7xl px-4 pt-4 sm:px-6" aria-live="polite">
  {% for message in messages %}
    <div role="status" class="mb-2 rounded-lg px-4 py-3 text-sm font-medium
      {% if message.tags == 'error' %}bg-red-50 text-red-800 ring-1 ring-red-200
      {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-800 ring-1 ring-emerald-200
      {% else %}bg-sky-50 text-sky-800 ring-1 ring-sky-200{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
